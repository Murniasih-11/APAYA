<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" fill="none">
  <!-- Shadow -->
  <ellipse cx="200" cy="400" rx="110" ry="14" fill="#C9B8AD" opacity="0.35"/>

  <!-- Body -->
  <ellipse cx="200" cy="290" rx="115" ry="110" fill="#D4C4B8"/>

  <!-- Belly patch -->
  <ellipse cx="200" cy="310" rx="68" ry="78" fill="#EDE0D4"/>

  <!-- Tail -->
  <path d="M300 340 Q360 310 345 260 Q335 230 310 250 Q295 265 305 290 Q315 315 300 340Z" fill="#C0B0A4"/>
  <path d="M340 265 Q330 248 318 256" stroke="#B8A89A" stroke-width="1.5" fill="none"/>

  <!-- Left paw -->
  <ellipse cx="143" cy="388" rx="38" ry="20" fill="#D4C4B8"/>
  <ellipse cx="128" cy="391" rx="13" ry="10" fill="#C8B8AC"/>
  <ellipse cx="143" cy="394" rx="13" ry="10" fill="#C8B8AC"/>
  <ellipse cx="158" cy="391" rx="13" ry="10" fill="#C8B8AC"/>

  <!-- Right paw -->
  <ellipse cx="257" cy="388" rx="38" ry="20" fill="#D4C4B8"/>
  <ellipse cx="242" cy="391" rx="13" ry="10" fill="#C8B8AC"/>
  <ellipse cx="257" cy="394" rx="13" ry="10" fill="#C8B8AC"/>
  <ellipse cx="272" cy="391" rx="13" ry="10" fill="#C8B8AC"/>

  <!-- Neck -->
  <ellipse cx="200" cy="195" rx="70" ry="45" fill="#D4C4B8"/>

  <!-- Head -->
  <ellipse cx="200" cy="148" rx="95" ry="88" fill="#D4C4B8"/>

  <!-- Left ear -->
  <path d="M118 95 L100 38 L155 72Z" fill="#D4C4B8"/>
  <path d="M122 92 L108 52 L148 76Z" fill="#D8B8B2"/>

  <!-- Right ear -->
  <path d="M282 95 L300 38 L245 72Z" fill="#D4C4B8"/>
  <path d="M278 92 L292 52 L252 76Z" fill="#D8B8B2"/>

  <!-- Face markings - forehead stripes -->
  <path d="M188 80 Q200 72 212 80" stroke="#C0B0A2" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M183 73 Q200 64 217 73" stroke="#C0B0A2" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Eyes -->
  <!-- Left eye -->
  <ellipse cx="168" cy="148" rx="18" ry="16" fill="#FFFEFA"/>
  <ellipse cx="168" cy="150" rx="11" ry="13" fill="#6B5A4E"/>
  <ellipse cx="168" cy="150" rx="6" ry="8" fill="#2A1F1A"/>
  <ellipse cx="172" cy="146" rx="3" ry="3" fill="white"/>
  <!-- Left eye sleepy top lid -->
  <path d="M152 144 Q168 136 184 144" stroke="#B09080" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Right eye -->
  <ellipse cx="232" cy="148" rx="18" ry="16" fill="#FFFEFA"/>
  <ellipse cx="232" cy="150" rx="11" ry="13" fill="#6B5A4E"/>
  <ellipse cx="232" cy="150" rx="6" ry="8" fill="#2A1F1A"/>
  <ellipse cx="236" cy="146" rx="3" ry="3" fill="white"/>
  <!-- Right eye sleepy top lid -->
  <path d="M216 144 Q232 136 248 144" stroke="#B09080" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Nose -->
  <path d="M194 176 Q200 170 206 176 L200 183Z" fill="#D8B8B2"/>
  <line x1="200" y1="183" x2="200" y2="192" stroke="#C4A09A" stroke-width="1.5"/>
  <path d="M200 192 Q190 200 184 196" stroke="#C4A09A" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <path d="M200 192 Q210 200 216 196" stroke="#C4A09A" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Whiskers left -->
  <line x1="155" y1="182" x2="90" y2="174" stroke="#B0A090" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="155" y1="188" x2="88" y2="188" stroke="#B0A090" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="155" y1="194" x2="92" y2="202" stroke="#B0A090" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>

  <!-- Whiskers right -->
  <line x1="245" y1="182" x2="310" y2="174" stroke="#B0A090" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="245" y1="188" x2="312" y2="188" stroke="#B0A090" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="245" y1="194" x2="308" y2="202" stroke="#B0A090" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>

  <!-- Cheek blush -->
  <ellipse cx="148" cy="196" rx="18" ry="10" fill="#D8B8B2" opacity="0.4"/>
  <ellipse cx="252" cy="196" rx="18" ry="10" fill="#D8B8B2" opacity="0.4"/>

  <!-- Books stack under paws -->
  <rect x="95" y="368" width="72" height="14" rx="3" fill="#B6A397"/>
  <rect x="102" y="354" width="60" height="14" rx="3" fill="#C9B8AC"/>
  <rect x="99" y="340" width="66" height="14" rx="3" fill="#D4C4B8" stroke="#B6A397" stroke-width="1"/>

  <!-- Laptop hint on right -->
  <rect x="238" y="354" width="70" height="10" rx="2" fill="#B6A397"/>
  <rect x="232" y="362" width="82" height="6" rx="1" fill="#A09090"/>
  <rect x="241" y="340" width="64" height="14" rx="2" fill="#C9B8AC"/>
  <rect x="245" y="343" width="56" height="8" rx="1" fill="#E9DED2"/>

  <!-- Tiny text lines on laptop screen -->
  <line x1="249" y1="346" x2="295" y2="346" stroke="#B6A397" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="249" y1="349" x2="285" y2="349" stroke="#B6A397" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
</svg>
